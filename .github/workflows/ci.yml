name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q cyrus front-end examples tests
      - name: Unit tests (offline, provider SDKs stubbed)
        run: python -m unittest discover -s tests -t . -v
